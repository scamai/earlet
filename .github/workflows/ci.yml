name: Earlet CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earlet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Earlet (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Boundary and Python gates
        run: python tools/run_tests.py --suite boundary --suite python-gate --ci

  macos:
    name: Earlet (macOS)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Shared, Swift, and package gates
        run: python tools/run_tests.py --suite boundary --suite python-gate --suite swift --suite mac-package --ci
