name: Recognition report
description: The app typed different words from the ones you said.
labels: ["recognition"]
body:
  - type: markdown
    attributes:
      value: |
        Recognition reports help most when the same words go wrong more than
        once. **This issue is public:** anyone can read what you write here.
        Rather than quoting something you dictated for real, dictate a
        neutral test sentence that shows the problem (for example, one that
        uses the word that goes wrong) and type out that sentence and what
        Earlet typed. Never attach a recording of anyone else's voice, and
        think twice before attaching your own. If a maintainer asks for
        something you would rather not post publicly, send it through the
        private channel in
        [SUPPORT.md](https://github.com/scamai/earlet/blob/main/SUPPORT.md#sharing-something-privately).
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - Windows x64
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and build
      description: The app's window shows both under Troubleshooting.
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
      description: The language setting in the app's window, and the language you spoke if it was Automatic.
      placeholder: Automatic, speaking English
    validations:
      required: true
  - type: textarea
    id: said
    attributes:
      label: What you said
      description: Optional, and public. A neutral test sentence works best; leave out anything private.
    validations:
      required: false
  - type: textarea
    id: typed
    attributes:
      label: What was typed
      description: Optional, and public. What Earlet typed for that sentence.
    validations:
      required: false
  - type: dropdown
    id: vocabulary
    attributes:
      label: Is the missed word in your Vocabulary list?
      options:
        - "Yes"
        - "No"
        - Not sure
        - No single word was missed
    validations:
      required: true
  - type: dropdown
    id: microphone
    attributes:
      label: Microphone
      options:
        - Built-in
        - USB or wired
        - Bluetooth
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Background noise, accent, speaking speed, how often it happens. No logs or microphone names here.
