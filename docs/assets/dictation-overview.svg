<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Dictation workflow</title>
  <desc id="desc">Speech is captured, recognized by the local worker, and inserted into the focused app. Recovery, an encrypted history on the Mac and vocabulary learning support the workflow.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="24" fill="#ffffff"/>
  <text x="56" y="52" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="700">A focused desktop workflow</text>
  <text x="56" y="80" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">Illustrative workflow for the macOS source preview</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="56" y="124" width="300" height="126" rx="18" fill="url(#panel)" stroke="#cbd5e1"/>
    <circle cx="100" cy="166" r="22" fill="#dbeafe"/>
    <path d="M100 153v25M91 170a9 9 0 0 0 18 0v-9a9 9 0 0 0-18 0zM86 170a14 14 0 0 0 28 0M100 184v8M92 192h16" fill="none" stroke="#2563eb" stroke-linecap="round" stroke-width="3"/>
    <text x="136" y="165" fill="#0f172a" font-size="19" font-weight="700">Capture</text>
    <text x="136" y="192" fill="#475569" font-size="15">Hold, speak, release</text>
    <text x="136" y="215" fill="#475569" font-size="15">Native microphone access</text>

    <rect x="450" y="124" width="300" height="126" rx="18" fill="url(#panel)" stroke="#cbd5e1"/>
    <circle cx="494" cy="166" r="22" fill="#dcfce7"/>
    <path d="M483 166h22M494 155v22M486 158l16 16M502 158l-16 16" stroke="#16a34a" stroke-linecap="round" stroke-width="3"/>
    <text x="530" y="165" fill="#0f172a" font-size="19" font-weight="700">Recognize locally</text>
    <text x="530" y="192" fill="#475569" font-size="15">A separate speech worker</text>
    <text x="530" y="215" fill="#475569" font-size="15">uses your supplied model</text>

    <rect x="844" y="124" width="300" height="126" rx="18" fill="url(#panel)" stroke="#cbd5e1"/>
    <circle cx="888" cy="166" r="22" fill="#fef3c7"/>
    <path d="M878 166h20M888 156v20M880 176l16-20" fill="none" stroke="#d97706" stroke-linecap="round" stroke-width="3"/>
    <text x="924" y="165" fill="#0f172a" font-size="19" font-weight="700">Insert</text>
    <text x="924" y="192" fill="#475569" font-size="15">Paste into the focused app</text>
    <text x="924" y="215" fill="#475569" font-size="15">Recover the latest result</text>

    <path d="M356 187h84" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M750 187h84" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="190" y="286" width="820" height="42" rx="21" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="600" y="313" text-anchor="middle" fill="#334155" font-size="15">Recovery keeps one failed take • History is encrypted on the Mac • Learning keeps supported corrections</text>
  </g>
</svg>
